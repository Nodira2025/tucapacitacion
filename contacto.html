<head>
    <meta charset="UTF-8">

        content="¿Tenés dudas sobre algún curso? Contactate con nosotros por WhatsApp o formulario. Estamos para ayudarte a empezar tu formación profesional en Santiago del Estero.">

    <!-- Open Graph -->
    <meta property="og:title" content="Contacto | Tu Capacitación Santiago">
    <meta property="og:description" content="Escribinos y sacate todas las dudas. Empezá a estudiar hoy.">
    <meta property="og:image" content="https://www.tucapacitacion.com/img/logo.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">

                <a href="cursos.html" class="text-white text-decoration-none">
                    <i class="fas fa-search fa-lg"></i>
                </a>
            </div>

            <!-- Logo (Center) -->
            <a class="navbar-brand" href="index.html">
                <img src="img/logo.png" alt="Tu Capacitación"
                    onerror="this.onerror=null; this.src=''; this.alt='Tu Capacitación'; this.style.color='white';">
            </a>

            <!-- Toggle Button (Right) -->
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <i class="fas fa-bars fa-lg"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="instituto.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="cursos.html">Cursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="sedes.html">Sedes</a></li>
                    <li class="nav-item"><a class="nav-link" href="galeria.html">Galería</a></li>
                    <li class="nav-item"><a class="nav-link" href="trabaja-con-nosotros.html">Trabajo</a>
                    </li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    <li class="nav-item d-none d-lg-flex ms-lg-3 align-items-center">
                        <form class="navbar-search" action="cursos.html" method="GET">
                            <input class="form-control form-control-sm shadow-none" type="search"
                                placeholder="Buscar curso..." aria-label="Buscar" name="q">
                            <button class="btn btn-sm shadow-none" type="submit">
                                <i class="fas fa-search"></i>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero-section sub-page">
        <div class="container text-center hero-content-wrapper">
            <h1 class="display-4 fw-bold mb-3">¿Tenés dudas? Estamos para ayudarte.</h1>
            <p class="lead mx-auto">Da el primer paso hacia tu futuro profesional. Contactanos hoy mismo.</p>
        </div>
    </section>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div data-aos="fade-up" class="card shadow-sm border-0 p-4" style="border-radius: 20px;">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4" style="color: var(--primary-blue);">Envíanos tu Consulta
                        </h3>
                        <!-- Notice we use our custom JS to intercept this and send it via WhatsApp -->
                        <form id="contactForm">
                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold">Nombre completo *</label>
                                <input type="text" class="form-control form-control-lg" id="name" required
                                    placeholder="Tu nombre">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Correo electrónico *</label>
                                <input type="email" class="form-control form-control-lg" id="email" required
                                    placeholder="tu@email.com">
                            </div>
                            <div class="mb-3">
                                <label for="area" class="form-label fw-bold">Área de interés *</label>
                                <select class="form-select form-select-lg" id="area" required>
                                    <option value="" disabled selected>Selecciona un área...</option>
                                    <option value="Salud">ÁREA SALUD</option>
                                    <option value="Técnica">ÁREA TÉCNICA</option>
                                    <option value="Contable">ÁREA CONTABLE</option>
                                    <option value="Belleza">ÁREA BELLEZA</option>
                                    <option value="Informática">ÁREA INFORMÁTICA</option>
                                    <option value="Otra">OTRA ÁREA</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label for="message" class="form-label fw-bold">Tu consulta *</label>
                                <textarea class="form-control form-control-lg" id="message" rows="4" required
                                    placeholder="Escribe tu mensaje aquí..."></textarea>
                            </div>
                            <button type="submit"
                                class="btn btn-buy btn-lg w-100 py-3 d-flex justify-content-center align-items-center">
                                <i class="fab fa-whatsapp me-2 fa-lg"></i> Enviar por WhatsApp
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Social Floating Buttons (Grouped) -->

    <!-- Floating Cart -->
    <div class="cart-float position-fixed dropdown dropup" style="bottom: 190px; right: 40px; z-index: 1060;">
        <button
            class="btn btn-primary rounded-circle shadow-lg d-flex align-items-center justify-content-center dropdown-toggle cart-icon"
            type="button" id="cartFloatDropdown" data-bs-toggle="dropdown" aria-expanded="false"
            style="width: 60px; height: 60px; font-size: 24px; padding: 0; background-color: var(--primary-blue); border-color: var(--primary-blue);">
            <i class="fas fa-shopping-cart"></i>
            <span
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow-sm cart-count"
                style="font-size: 0.75rem;">
                0
                <span class="visually-hidden">cursos en carrito</span>
            </span>
        </button>
        <div class="dropdown-menu dropdown-menu-end mb-3 shadow-lg border-0 rounded-3 p-0 cart-dropdown"
            aria-labelledby="cartFloatDropdown" style="width: 350px;">
            <div
                class="bg-light px-3 py-2 border-bottom rounded-top-3 d-flex justify-content-between align-items-center">
                <h6 class="mb-0 fw-bold" style="color: var(--primary-blue);">Mi Carrito</h6>
                <span class="badge bg-primary rounded-pill cart-count">0</span>
            </div>
            <div id="cart-items" class="p-2 overflow-auto" style="max-height: 300px;">
                <!-- Items injected by JS -->
                <div class="text-center p-3 text-muted small">Tu carrito está vacío</div>
            </div>
            <div class="p-3 bg-light border-top rounded-bottom-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-bold text-muted">Total:</span>
                    <span class="fw-bold fs-5 text-dark" id="cart-total">$0</span>
                </div>
                <!-- WhatsApp Checkout btn -->
                <button class="btn btn-success w-100 fw-bold shadow-sm" id="btn-checkout" disabled>
                    <i class="fab fa-whatsapp me-2"></i>Abonar o pedir más info
                </button>
            </div>
        </div>
    </div>

    <div class="social-float-container">
        <!-- Floating Toggle -->
        <button class="social-float-main shadow-lg" id="socialFloatToggle">
            <i class="fas fa-plus"></i>
        </button>
        <!-- Independent WhatsApp -->
        <a href="https://wa.me/5493855140883" class="social-float-wa shadow-lg" target="_blank">
            <i class="fab fa-whatsapp"></i>
        </a>
        <!-- Grouped Socials -->
        <div class="social-float-links">
            <a href="https://www.facebook.com/Tucapacitacionoficial" class="social-float-item facebook"
                target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/tucapacitacionoficial" class="social-float-item instagram"
                target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@tucapacitacion" class="social-float-item tiktok" target="_blank"><i
                    class="fab fa-tiktok"></i></a>
            <a href="https://www.youtube.com/@tucapacitacion" class="social-float-item youtube" target="_blank"><i
                    class="fab fa-youtube"></i></a>
        </div>
    </div>

</body>
